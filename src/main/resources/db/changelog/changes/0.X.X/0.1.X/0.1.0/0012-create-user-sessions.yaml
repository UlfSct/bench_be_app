databaseChangeLog:
  - changeSet:
      id: 0.1.0-0012-create-user-sessions
      author: n3kit
      changes:
        - createTable:
            tableName: user_sessions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: ended_at
                  type: timestamptz
              - column:
                  name: ip_address
                  type: varchar(45)
                  constraints:
                    nullable: false
              - column:
                  name: user_agent
                  type: varchar(500)
              - column:
                  name: is_ended
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: user_sessions
            constraintName: fk_user_sessions_user
            referencedColumnNames: id
            referencedTableName: users
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: user_sessions
            cascadeConstraints: true
