databaseChangeLog:
  - changeSet:
      id: 0.1.0-0006-create-email-verification-tokens
      author: n3kit
      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_email_verification_token_user_id
                    nullable: false
              - column:
                  name: token
                  type: uuid
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_email_verification_token_token
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: email_verification_tokens
            constraintName: fk_email_verification_tokens_user
            referencedColumnNames: id
            referencedTableName: users
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: email_verification_tokens
            cascadeConstraints: true