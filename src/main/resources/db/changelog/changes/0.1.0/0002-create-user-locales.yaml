databaseChangeLog:
  - changeSet:
      id: 0.1.0-0002-create-user-locales
      author: n3kit
      changes:
        - createTable:
            tableName: user_locales
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_user_locales_code
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: user_locales
            cascadeConstraints: true